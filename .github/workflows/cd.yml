name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fc-primary-backend
            dockerfile: apps/primary-backend/Dockerfile
            context: .
          - service: fc-hooks
            dockerfile: apps/hooks/Dockerfile
            context: .
          - service: fc-processor
            dockerfile: apps/processor/Dockerfile
            context: .
          - service: fc-worker
            dockerfile: apps/worker/Dockerfile
            context: .
          - service: fc-frontend
            dockerfile: apps/frontend/Dockerfile
            context: .
          - service: fc-server
            dockerfile: Dockerfile
            context: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Credentials
        id: docker_creds
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "username=${DOCKERHUB_USERNAME:-rohanakode490}" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "username=rohanakode490" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.docker_creds.outputs.has_token == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.docker_creds.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_creds.outputs.username }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.docker_creds.outputs.has_token == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Build
        if: steps.docker_creds.outputs.has_token != 'true'
        run: |
          echo "Image ${{ matrix.service }} built successfully in test mode."
          echo "To push to Docker Hub, configure DOCKERHUB_TOKEN in GitHub repository secrets."

  deploy-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check Hugging Face Token
        id: check_hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Push to Hugging Face Space
        if: steps.check_hf.outputs.has_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://rakode490:$HF_TOKEN@huggingface.co/spaces/rakode490/flow-server main:main

      - name: Hugging Face Token Notice
        if: steps.check_hf.outputs.has_token != 'true'
        run: |
          echo "HF_TOKEN secret not configured in GitHub repository secrets."
          echo "To enable automated sync to Hugging Face Spaces (rakode490/flow-server), add HF_TOKEN to repository secrets."
